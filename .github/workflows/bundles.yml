name: Validate and build bundles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run validate:cowork
      - uses: actions/upload-artifact@v4
        with:
          name: tactic-plugin-bundles
          path: dist/
          if-no-files-found: error
